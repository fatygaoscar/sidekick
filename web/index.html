<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sidekick</title>
    <link rel="icon" type="image/x-icon" href="/static/sidekick-logo-simple.ico">
    <link rel="stylesheet" href="/static/css/styles.css?v=20260308b">
</head>
<body class="main-page">
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">Sidekick</h1>
            <div class="header-right">
                <a href="/static/recordings.html" class="header-link">History</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="record-hero">
                <button id="record-btn" class="record-btn" aria-pressed="false">
                    Record
                </button>
            </div>

            <div class="record-support">
                <div class="visualizer-section">
                    <canvas id="audio-canvas" width="400" height="60"></canvas>
                </div>

                <div id="timer" class="timer">00:00:00</div>

                <div id="live-preview" class="live-preview hidden" aria-live="polite">
                    <div class="live-preview-label">Live Preview</div>
                    <div id="live-preview-text" class="live-preview-text">Listening...</div>
                </div>
            </div>
        </main>

        <div class="mobile-history-bar">
            <a href="/static/recordings.html" class="btn mobile-history-link">History</a>
        </div>

        <!-- Status Bar -->
        <footer class="status-bar">
            <div class="status-left" id="status-text"></div>
            <div class="status-right">
                <span class="connection-dot" id="connection-dot"></span>
                <span class="connection-text" id="connection-text">Ready</span>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/audio.js?v=20260307l"></script>
    <script src="/static/js/websocket.js?v=20260210h"></script>
    <script src="/static/js/recording-workspace.js?v=20260307bt"></script>
    <script src="/static/js/app.js?v=20260308b"></script>
</body>
</html>
